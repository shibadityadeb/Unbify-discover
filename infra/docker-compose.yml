# Local development infrastructure only. Production uses managed services via env.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: unbify
      POSTGRES_PASSWORD: unbify_dev_only
      POSTGRES_DB: discover
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
