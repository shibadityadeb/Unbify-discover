# Local development infrastructure only. Production uses managed services via env.
# PostgreSQL is the whole operational backbone: state, jobs, locks, intelligence.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: unbify
      POSTGRES_PASSWORD: unbify_dev_only
      POSTGRES_DB: discover
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
